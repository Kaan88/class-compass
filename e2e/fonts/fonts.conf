<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts for the e2e job on the Ubuntu CI runner (D-205). The app uses the device's own fonts
  (src/shared/themePackage/presets.ts: system-ui, 'Segoe UI', …). The layout and fit specs were
  written against Windows, where system-ui is Segoe UI; on Ubuntu it falls back to DejaVu Sans,
  which no classroom device uses and which is much wider. Selawik is Microsoft's open (OFL)
  fallback font made to Segoe UI's metrics, so Chromium on the runner lays text out as a Windows
  classroom display does. Installed by .github/workflows/ci.yml into ~/.config/fontconfig/.
-->
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Selawik</family></accept>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer><family>Selawik</family></prefer>
  </alias>
</fontconfig>
