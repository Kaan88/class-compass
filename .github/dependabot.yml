# Dependabot opens pull requests only: nothing is merged on its own. Minor and patch updates
# come in one grouped pull request a week per ecosystem; each major update comes on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    commit-message: {prefix: deps}
    ignore:
      # TypeScript 7: no released typescript-eslint accepts it (8.74.0 peer: typescript >=4.8.4 <6.1.0),
      # so `npm ci` fails with ERESOLVE. Remove this entry once `npm view typescript-eslint
      # peerDependencies` includes 7.x, then update both together and run check + build.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/browser-setup"]
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    commit-message: {prefix: ci}
    groups:
      actions:
        patterns: ["*"]
