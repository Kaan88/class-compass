name: CI
# Kept lean (D-082; written while the repo was private and Actions minutes were limited):
# - every push to main: one Ubuntu job (typecheck, lint, unit/integration tests, build);
#   docs-only pushes are skipped and superseded runs are cancelled
# - Windows and browser (e2e) jobs: weekly and on demand (Actions tab → CI → Run workflow; the
#   `specs` input runs only the named e2e specs). They are also run locally before each stage is
#   committed. The full e2e suite takes about 20 minutes on the Ubuntu runner (D-205).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      specs:
        description: 'e2e only: spec files to run (space-separated, e.g. e2e/board-40.spec.ts); empty runs the whole suite'
        required: false
        default: ''
      visual_update:
        description: 'Take the Linux visual baseline set instead of running the suite (uploads e2e/visual-baselines/linux/ as an artifact; docs/OPERATIONS.md)'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  check-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    # Browser tests against a throw-away server with the fictional demo school (D-037).
    if: (github.event_name == 'workflow_dispatch' && !inputs.visual_update) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/browser-setup
      - run: npx playwright test $SPECS
        env:
          SPECS: ${{ github.event.inputs.specs }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-update:
    # Manual only: takes the Linux pixel-diff baseline in the same image as the e2e job (D-206).
    if: github.event_name == 'workflow_dispatch' && inputs.visual_update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/browser-setup
      - run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual-baselines/linux/
          retention-days: 7
